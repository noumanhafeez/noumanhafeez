name: Render 3D Monster

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "3d-render/**"

jobs:
  render:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        working-directory: 3d-render
        run: npm install

      - name: Render frames and assemble APNG
        working-directory: 3d-render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: noumanhafeez
        run: node capture.mjs

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: 3d-render/dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}